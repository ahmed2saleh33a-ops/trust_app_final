name: trust_center
description: سمايل كوزمتك - تطبيق إدارة الطلبات والمندوبين
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  
  # State Management
  provider: ^6.1.1
  
  # Backend & API
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.0
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  file_picker: ^8.0.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  
  # Local Notifications (لـ Android/iOS فقط)
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # الأصول (الملفات والصور)
  assets:
    - assets/images/
